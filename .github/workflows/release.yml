name: Release (Changesets 🦋)

on:
    workflow_dispatch:
    push:
        branches:
            - main

env:
    CI: true
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    version:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
            actions: write
        steps:
            - name: Checkout code repository
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.GH_PAT }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.13'

            - name: Setup uv
              uses: astral-sh/setup-uv@v7

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      rust/config -> rust/config/target
                  cache-on-failure: true

            - name: Setup Go
              uses: actions/setup-go@v7
              with:
                  go-version: '1.23'
                  cache-dependency-path: go/config/go.sum

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Install dependencies
              run: pnpm install

            - name: Sync Python dependencies
              run: uv sync --group dev
              working-directory: python

            - name: Version consistency (all 7 languages)
              run: pnpm version:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            # `pnpm test`/`build`/`format` fan out to all seven languages. This
            # job runs on ubuntu with no Swift toolchain and no JDK setup, so
            # both are declared skips — PR checks gate them on their own runners
            # before anything reaches main. with-toolchain.mjs fails on any
            # UNDECLARED missing toolchain.
            - name: Test
              run: pnpm test
              env:
                  SMOOAI_SKIP_TOOLCHAINS: swift,java

            - name: Build
              run: pnpm build
              env:
                  SMOOAI_SKIP_TOOLCHAINS: swift,java

            - name: Format
              run: pnpm format
              env:
                  SMOOAI_SKIP_TOOLCHAINS: swift,java

            - name: Version Update 🦋
              id: changesets
              uses: changesets/action@v2
              with:
                  commit: '🦋 New version release'
                  title: '🦋 New version release'
                  version: pnpm run version:bump
                  publish: pnpm ci:publish
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
                  NPM_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}

            - name: Publish smooai-config to PyPI
              if: steps.changesets.outputs.published == 'true'
              run: uv run poe publish
              working-directory: python
              env:
                  UV_PUBLISH_TOKEN: ${{ secrets.SMOOAI_PYPI_TOKEN }}

            - name: Publish smooai-config to crates.io
              if: steps.changesets.outputs.published == 'true'
              # --locked: publish exactly the dependency set CI tested. If this
              # fails the lockfile is genuinely stale — refresh and commit it,
              # do not drop the flag.
              run: cargo publish --locked --manifest-path rust/config/Cargo.toml
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.SMOOAI_CARGO_REGISTRY_TOKEN }}

            - name: Tag and publish Go module
              if: steps.changesets.outputs.published == 'true'
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="go/config/v${VERSION}"
                  echo "Creating Go module tag: ${TAG}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${TAG}"
                  git push origin "${TAG}"
                  echo "Go module tagged and pushed: ${TAG}"

            - name: Publish SmooAI.Config to NuGet
              if: steps.changesets.outputs.published == 'true'
              working-directory: dotnet
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
              run: |
                  if [ -z "${NUGET_API_KEY}" ]; then
                      echo "::error::NUGET_API_KEY secret is not set"
                      exit 1
                  fi
                  dotnet pack src/SmooAI.Config/SmooAI.Config.csproj -c Release --no-build -o dist
                  dotnet nuget push "dist/*.nupkg" \
                      --api-key "${NUGET_API_KEY}" \
                      --source https://api.nuget.org/v3/index.json \
                      --skip-duplicate

            - name: Auto-Merge Changeset PR
              run: |
                  PR_NUMBER=$(gh pr list --state open --head changeset-release/main --json number --jq '.[0].number')

                  if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
                    echo "Found Changeset PR #$PR_NUMBER, attempting to auto-merge..."
                    gh pr merge "$PR_NUMBER" --auto --squash
                    # The merge push event will trigger a new workflow run automatically
                  else
                    echo "No open Changeset PR found, skipping merge."
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT }}

            # Every publish step above is gated on `steps.changesets.outputs.published`,
            # which the action sets by parsing the publish script's stdout. When that
            # parsing broke, all four SKIPPED and the job still reported success —
            # 6.11.6, 6.11.7 and 6.12.0 reached npm alone. This asserts the lockstep
            # the repo actually promises, and fails loudly.
            #
            # LAST step, and `always()`. Placed before Auto-Merge in the first
            # cut, which deadlocked recovery: the guard failed on a divergence,
            # the auto-merge step was skipped, the changeset PR never merged, so
            # nothing new published and the divergence persisted. A guard must
            # never be able to block the thing that fixes what it is guarding.
            #
            # Not gated on `published` either — conditioning it on the flag that
            # broke would skip it in exactly the failure case. It anchors on
            # npm's own latest, so a run that published nothing asserts nothing.
            - name: Verify all five registries are in lockstep
              if: always()
              run: pnpm registry:check
