name: PR Checks

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            # Toolchains come from mise.toml, read here by mise-action so the runner
            # and a developer's shell resolve identical versions.
            - name: Setup toolchains (mise)
              uses: jdx/mise-action@v4

            - name: Locate pnpm store
              run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

            - name: Cache pnpm store
              uses: actions/cache@v6
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: ${{ runner.os }}-pnpm-store-

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      rust/config -> rust/config/target
                  cache-on-failure: true

            - name: Setup .NET
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Install dependencies
              run: pnpm install

            - name: Sync Python dependencies
              run: uv sync --group dev
              working-directory: python

            # Fails loudly if any of the seven language manifests has fallen off
            # the release train — Kotlin sat at the default 0.1.0 for months
            # because nothing asserted this.
            - name: Version consistency (all 7 languages)
              run: pnpm version:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            # `pnpm format:check`, `test` and `build` now each fan out to all
            # seven languages. Kotlin and Swift are declared skips here because
            # they have dedicated jobs below (JDK setup / macOS runner) —
            # scripts/with-toolchain.mjs fails the job on any UNDECLARED missing
            # toolchain, so a language can never silently drop out of CI again.
            - name: Format check
              run: pnpm format:check
              env:
                  SMOOAI_SKIP_TOOLCHAINS: swift,java

            - name: Test
              run: pnpm test
              env:
                  SMOOAI_SKIP_TOOLCHAINS: swift,java

            - name: Build
              run: pnpm build
              env:
                  SMOOAI_SKIP_TOOLCHAINS: swift,java

    # Swift needs a macOS runner (SMOODEV-2380) — the linux Swift toolchain's
    # FoundationNetworking URLSession diverges from the Darwin one the SDK's
    # consumers (iOS apps) actually run on.
    swift_checks:
        runs-on: macos-26
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            # Root manifest (SMOODEV-2382) — same sources/tests as swift/Package.swift,
            # and validates what SPM consumers actually resolve.
            - name: Swift build + test
              run: swift test
            - name: Swift format check
              run: swift format lint --strict --recursive --configuration .swift-format swift/Sources swift/Tests

    kotlin_checks:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: '17'
            - uses: gradle/actions/setup-gradle@v6
            - name: Kotlin build + test
              working-directory: kotlin
              run: ./gradlew test --console=plain
            - name: Kotlin format check (ktlint)
              working-directory: kotlin
              run: ./gradlew ktlintCheck --console=plain
